plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'org.openapi.generator' version '7.5.0'
}

group = 'com.worksphere'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('mapstructVersion', "1.5.5.Final")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    
    // Database
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    
    // OpenAPI generator dependencies
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.21'
    
    // MapStruct & Lombok
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def openApiSpecFile = "$rootDir/../docs/openapi.yaml"
def generatedSourcesDir = "$buildDir/generated/src/main/java"

openApiGenerate {
    generatorName = "spring"
    inputSpec = openApiSpecFile
    outputDir = "$buildDir/generated"
    apiPackage = "com.worksphere.api"
    modelPackage = "com.worksphere.api.dto"
    configOptions = [
        interfaceOnly: "true",
        useSpringBoot3: "true",
        useJakartaEe: "true",
        openApiNullable: "false",
        skipDefaultInterface: "true",
        useTags: "true"
    ]
}

sourceSets {
    main {
        java {
            srcDirs += generatedSourcesDir
        }
    }
}

compileJava.dependsOn tasks.named("openApiGenerate")
