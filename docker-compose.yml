version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: worksphere-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: worksphere
      MYSQL_USER: worksphere_user
      MYSQL_PASSWORD: worksphere_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: worksphere-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/worksphere?useSSL=false&allowPublicKeyRetrieval=true
      KC_DB_USERNAME: worksphere_user
      KC_DB_PASSWORD: worksphere_password
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e \"GET /health/ready HTTP/1.1\nhost: localhost:8080\nConnection: close\n\n\" >&3 && cat <&3 | grep -q \"status.*UP\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
